<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DeskFLow: {%block title%}{%endblock%}</title>

    <!-- include bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.3.7/css/dataTables.bootstrap5.min.css"
    />
    <!-- css sheet -->
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg align-items-center bg-light border p-2">
      <div class="container-fluid">
        {% if session.get('user_id') %}
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offCanvas"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        {% endif %}
        <a class="navbar-brand d-flex align-items-center" href="/">
          <img
            src="{{
            url_for('static', filename='images/logo.png')
        }}"
            alt="logo"
            width="40"
          />
          FlowDesk
        </a>

        {% if session.get('user_id') %}
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offCanvas">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">FlowDesk</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
          </div>
          <div class="offcanvas-body flex-grow-1 justify-content-end">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a href="/index" class="nav-link">Dashboard</a>
              </li>
              <li class="nav-item">
                <a href="/tasks" class="nav-link">Tasks</a>
              </li>
              <li class="nav-item">
                <a href="/new_task" class="nav-link">Nuova Task</a>
              </li>
              <li class="nav-item">
                <a href="/logout" class="nav-link">Logout</a>
              </li>
            </ul>
          </div>
        </div>

        {% endif %}
      </div>
    </nav>
    <main>
      <div class="container">{% block main %}{% endblock %}</div>
    </main>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.bootstrap5.min.js"></script>
  </body>
</html>
