<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- css sheet -->
    <link rel="stylesheet" href="/static/style.css" />

    <title>DeskFLow: {%block title%}{%endblock%}</title>

    <!-- include bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav
      class="nav p-2 nav-underline justify-content-around align-items-center bg-light border"
    >
      <a class="nav-link nav-brand" href="#">
        <img
          src="{{
            url_for('static', filename='images/logo.png')
        }}"
          alt="logo"
          width="40"
        />
        FlowDesk
      </a>
      {% if session["user_id"] %}
      <div class="d-flex gap-3">
        <a class="nav-link" href="#">Dashboard</a>
        <a class="nav-link" href="#">Practices</a>
      </div>
      <a class="nav-link" href="/logout">logout</a>
      {% else%}
      <a class="nav-link" href="/login">Login</a>
      <a class="nav-link" href="/register">Register</a>
      {% endif %}
    </nav>
    <main>
      <div class="container p-2">{% block main %} {% endblock %}</div>
    </main>
    <footer class="mb-5">
      <form
        action="https://validator.w3.org/check"
        class="text-center"
        enctype="multipart/form-data"
        method="post"
        target="_blank"
      >
        <input name="doctype" type="hidden" value="HTML5" />
        <input name="fragment" type="hidden" />
        <input
          alt="Validate"
          src="/static/I_heart_validator.png"
          type="image"
        />
        <!-- https://validator.w3.org/ -->
      </form>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          // Adapted from https://stackoverflow.com/a/10162353
          const html =
            "<!DOCTYPE " +
            document.doctype.name +
            (document.doctype.publicId
              ? ' PUBLIC "' + document.doctype.publicId + '"'
              : "") +
            (!document.doctype.publicId && document.doctype.systemId
              ? " SYSTEM"
              : "") +
            (document.doctype.systemId
              ? ' "' + document.doctype.systemId + '"'
              : "") +
            ">\n" +
            document.documentElement.outerHTML;
          document.querySelector(
            'form[action="https://validator.w3.org/check"] > input[name="fragment"]',
          ).value = html;
        });
      </script>
    </footer>
  </body>
</html>
