{% extends "layout.html" %} {% block title %} Register {% endblock %} {%block main
%}
<div class="register-page">
  <form class="d-flex flex-column gap-4 my-5" method="POST" action="/register">
    <div>
      <input
        autocomplete="off"
        type="text"
        autofocus
        name="username"
        placeholder="Username"
        class="form-control"
        required
      />
    </div>
    <div>
      <input
        autocomplete="off"
        type="password"
        autofocus
        name="password"
        placeholder="password"
        class="form-control"
        required
      />
    </div>
    <div>
      <button class="btn btn-primary w-100" type="submit">Registrati</button>
    </div>
    <div class="p-3 border-top text-center">
      <p>
        Hai già un account? <a href="/login">Accedi qui</a>
      </p>
  </form>
  </div>
{%endblock%}
